name: Refresh daily market turnover

on:
  schedule:
    - cron: '17 19 * * 1-5'
      timezone: 'Asia/Hong_Kong'
    - cron: '30 18 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      market:
        description: Market turnover to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - asia
          - cn
          - hk
          - us
      backfill:
        description: Number of recent trading days to request
        required: true
        default: '1'
        type: string
      dry_run:
        description: Fetch and validate without committing changes
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: data-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      markets: ${{ steps.turnover.outputs.markets }}
      latest_dates: ${{ steps.turnover.outputs.latest_dates }}
    steps:
      - name: Check out main with history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate current site and turnover parsers
        run: |
          node scripts/validate-site.mjs
          node scripts/validate-data.mjs
          node scripts/test-market-turnover.mjs

      - name: Select scheduled market
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MARKET: ${{ inputs.market }}
          MANUAL_BACKFILL: ${{ inputs.backfill }}
        run: |
          market=us
          backfill=1
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            market="$MANUAL_MARKET"
            backfill="$MANUAL_BACKFILL"
          elif [ "$SCHEDULE" = "17 19 * * 1-5" ]; then
            market=asia
          fi
          echo "market=$market" >> "$GITHUB_OUTPUT"
          echo "backfill=$backfill" >> "$GITHUB_OUTPUT"

      - name: Refresh market turnover snapshot
        id: turnover
        env:
          MARKET: ${{ steps.selection.outputs.market }}
          BACKFILL: ${{ steps.selection.outputs.backfill }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          args=(--market "$MARKET" --backfill "$BACKFILL")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/refresh-market-turnover.mjs "${args[@]}"

      - name: Validate refreshed data
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-site.mjs
          node scripts/test-market-turnover.mjs

      - name: Commit and push changed turnover
        id: publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dry run complete; no files will be committed."
            exit 0
          fi

          git add -- data/market-turnover.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new end-of-day turnover records detected."
            exit 0
          fi

          git config user.name "ai-capex-turnover-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh daily market turnover"
          pushed=false
          for attempt in 1 2 3; do
            if ! git fetch origin main; then
              sleep $((attempt * 2))
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Turnover data conflicts with a newer main commit; refusing to overwrite it." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$pushed" != "true" ]; then
            echo "Unable to push turnover data after 3 attempts." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          MARKETS: ${{ steps.turnover.outputs.markets }}
          LATEST_DATES: ${{ steps.turnover.outputs.latest_dates }}
        run: |
          {
            echo "## Daily market turnover refresh"
            echo "- Markets: \`${MARKETS:-none}\`"
            echo "- Latest dates: \`${LATEST_DATES:-none}\`"
            echo "- Data changed: \`${CHANGED:-false}\`"
            echo "- A shares and Hong Kong: after the Asia close"
            echo "- Nasdaq: after the New York close"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate latest main before deployment
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-site.mjs
          node scripts/test-market-turnover.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy refreshed turnover data to Pages
        id: deployment
        uses: actions/deploy-pages@v5
