name: Refresh insider sales after market close

on:
  schedule:
    - cron: '47 15 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '47 16 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      market:
        description: Disclosure market to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - cn
          - us
          - auto
      dry_run:
        description: Fetch and validate without committing changes
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: data-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      markets: ${{ steps.radar.outputs.markets }}
      fetched_forms: ${{ steps.radar.outputs.fetched_forms }}
      window_end: ${{ steps.radar.outputs.window_end }}
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check out main with history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate insider-sales parser and current snapshot
        run: node scripts/test-insider-sales.mjs

      - name: Refresh insider-sales disclosure snapshot
        id: radar
        env:
          MARKET: ${{ github.event_name == 'workflow_dispatch' && inputs.market || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--market "$MARKET")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$IS_MANUAL" = "true" ]; then
            args+=(--force)
          fi
          node scripts/refresh-insider-sales.mjs "${args[@]}"

      - name: Validate refreshed radar
        run: |
          node scripts/test-insider-sales.mjs
          node scripts/validate-data.mjs
          node scripts/validate-site.mjs

      - name: Commit and push changed radar data
        id: publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dry run complete; no files will be committed."
            exit 0
          fi

          git add -- data/insider-sales.json data/insider-sales-state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new disclosure or window change detected."
            exit 0
          fi

          git config user.name "ai-capex-insider-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh insider sales radar"
          pushed=false
          for attempt in 1 2 3; do
            if ! git fetch origin main; then
              sleep $((attempt * 2))
              continue
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Insider-sales data conflicts with a newer main commit; refusing to overwrite it." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$pushed" != "true" ]; then
            echo "Unable to push insider-sales data after 3 attempts." >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        env:
          CHANGED: ${{ steps.publish.outputs.changed }}
          MARKETS: ${{ steps.radar.outputs.markets }}
          FETCHED_FORMS: ${{ steps.radar.outputs.fetched_forms }}
          WINDOW_END: ${{ steps.radar.outputs.window_end }}
        run: |
          {
            echo "## Insider-sales radar refresh"
            echo "- Markets: \`${MARKETS:-none}\`"
            echo "- New SEC documents fetched: \`${FETCHED_FORMS:-0}\`"
            echo "- Rolling-window end: \`${WINDOW_END:-unchanged}\`"
            echo "- Data changed: \`${CHANGED:-false}\`"
            echo "- A shares: 15:47 Asia/Shanghai on trading weekdays"
            echo "- US shares: 16:47 America/New_York on trading weekdays"
            echo "- Form 4 can arrive up to two business days after the trade"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate latest main before deployment
        run: |
          node scripts/test-insider-sales.mjs
          node scripts/validate-data.mjs
          node scripts/validate-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy refreshed radar to Pages
        id: deployment
        uses: actions/deploy-pages@v5
